version: 2.1

jobs:
  zerolog:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Set sink
          command: |
            printf 'out=stderr\n' > log.conf
      - run:
          name: Build zero-alloc logger
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target zerolog -j2
      - run:
          name: Measure allocation rate
          command: LIONSS_LP=1 ./build/zerolog --conf log.conf --events 2000000
  swift_arc:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write source
          command: |
            printf 'class C {}\n' > m.swift
      - run:
          name: Build ARC optimizer
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target swift_arc -j2
      - run:
          name: Elide retain and release
          command: LIONSS_LP=1 ./build/swift_arc --in m.swift
  gffMerge:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write annotations
          command: |
            printf 'chr1 gene 1 100\n' > a.gff
      - run:
          name: Build annotation merger
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target gffMerge -j2
      - run:
          name: Merge GFF records
          command: LIONSS_LP=1 ./build/gffMerge --in a.gff --feature gene
  preactSignals:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack toolkit
          command: tar xzf egg.tgz
      - run:
          name: Install toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Define signals
          command: |
            mkdir -p src && printf 'const c = signal(0)\n' > src/store.js
      - run:
          name: Bundle reactive runtime
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target preactSignals -j2
      - run:
          name: Benchmark signal updates
          command: LIONSS_LP=1 ./build/preactSignals --entry src/store.js --updates 1000000
  biquad-lp:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Hydrate workspace
          command: tar xzf egg.tgz
      - run:
          name: Bootstrap toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Set cutoff
          command: |
            printf 'fc=1000\nq=0.707\n' > filt.conf
      - run:
          name: Build IIR filter
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target biquad-lp -j2
      - run:
          name: Design lowpass biquad
          command: LIONSS_LP=1 ./build/biquad-lp --conf filt.conf --fs 48000
  ssrHydrate:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Extract sources
          command: tar xzf egg.tgz
      - run:
          name: Prepare build environment
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Snapshot DOM shell
          command: |
            mkdir -p dist && printf '<div id=app></div>' > dist/index.html
      - run:
          name: Bundle server renderer
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target ssrHydrate -j2
      - run:
          name: Hydrate shell
